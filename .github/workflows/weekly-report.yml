# Weekly factory report (agents/report/, docs/weekly-report.md): autonomy, lead time, fix rounds, escalations and failed
# runs of the past week, posted as a project update on the Factory project. Can also be started by hand; "dry run"
# only prints the update.
name: Weekly factory report

on:
  schedule:
    # Mondays 07:00 UTC, after the log scout (05:00) and the dependency check (06:00).
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only print the update, don't post it)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: weekly-factory-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # report.sh removes LINEAR_API_KEY from the environment of the claude process it starts.
      - name: Run the weekly report
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: bash agents/report/report.sh
