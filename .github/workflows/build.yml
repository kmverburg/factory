# Builder agent. Called from each app repo's factory.yml when the relay
# sends a `factory-build` repository_dispatch event for a Linear issue.
name: Factory build

on:
  workflow_call:
    outputs:
      pr_number:
        description: Number of the pull request the agent opened (empty if none)
        value: ${{ jobs.build.outputs.pr_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      ISSUE_ID: ${{ github.event.client_payload.issue_id }}
      ISSUE_IDENTIFIER: ${{ github.event.client_payload.identifier }}
      ISSUE_TITLE: ${{ github.event.client_payload.title }}
      ISSUE_URL: ${{ github.event.client_payload.url }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check ticket
        run: |
          if [[ ! "$ISSUE_IDENTIFIER" =~ ^[A-Z0-9]+-[0-9]+$ ]]; then
            echo "::error::Missing or invalid Linear identifier: '$ISSUE_IDENTIFIER'"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Linear helpers
        run: |
          cat > "$RUNNER_TEMP/linear.sh" <<'EOF'
          linear_gql() {
            curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Content-Type: application/json" -H "Authorization: $LINEAR_API_KEY" \
              -d "$(jq -n --arg q "$1" --argjson v "$2" '{query: $q, variables: $v}')"
          }
          linear_set_state() {
            local data state_id
            data=$(linear_gql 'query($id: String!) { issue(id: $id) { team { states { nodes { id name } } } } }' \
              "$(jq -n --arg id "$1" '{id: $id}')") || { echo "::warning::Linear lookup failed"; return 0; }
            state_id=$(jq -r --arg n "$2" '.data.issue.team.states.nodes[] | select(.name == $n) | .id' <<<"$data" | head -n1)
            if [ -z "$state_id" ]; then echo "::warning::Linear state '$2' not found"; return 0; fi
            linear_gql 'mutation($id: String!, $s: String!) { issueUpdate(id: $id, input: { stateId: $s }) { success } }' \
              "$(jq -n --arg id "$1" --arg s "$state_id" '{id: $id, s: $s}')" >/dev/null \
              || echo "::warning::Linear state update failed"
          }
          linear_comment() {
            linear_gql 'mutation($i: String!, $b: String!) { commentCreate(input: { issueId: $i, body: $b }) { success } }' \
              "$(jq -n --arg i "$1" --arg b "$2" '{i: $i, b: $b}')" >/dev/null \
              || echo "::warning::Linear comment failed"
          }
          EOF

      - name: Create branch
        id: branch
        run: |
          slug=$(printf '%s' "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')
          branch="$(printf '%s' "$ISSUE_IDENTIFIER" | tr '[:upper:]' '[:lower:]')-${slug:-task}"
          git checkout -b "$branch"
          echo "name=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p .factory

      - name: Build with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --max-turns 80 --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash"
          prompt: |
            You are the builder agent in a small software factory. Implement the ticket below in this repository.

            <ticket id="${{ github.event.client_payload.identifier }}">
            Title: ${{ github.event.client_payload.title }}

            ${{ github.event.client_payload.description }}
            </ticket>

            How to work:
            1. Read CLAUDE.md (if present) first. It has this repo's commands, conventions and off-limits areas.
            2. Make the smallest change that fully meets the ticket's acceptance criteria. Match the existing code style.
            3. Add or update tests for behaviour you change, then run the repo's test, lint and build commands and fix what fails.
            4. Do NOT commit, push, create branches or open pull requests. The workflow does that after you finish.
            5. Never edit files under .github/, never read or change .env files or secrets, and never add credentials to code.

            When you are done, write a pull request description to .factory/PR_BODY.md with these sections:
            ## Summary (what changed and why), ## How I tested it (commands you ran and their results), ## Risks (anything a reviewer should look at closely, or "None known").

            If the ticket is ambiguous, contradicts the code, or can't be done safely, make NO code changes. Instead write
            your specific questions to .factory/QUESTIONS.md and stop. Asking is better than guessing.

      - name: Open pull request
        id: publish
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
        run: |
          source "$RUNNER_TEMP/linear.sh"

          if [ -s .factory/QUESTIONS.md ]; then
            linear_comment "$ISSUE_ID" "🤔 The builder agent needs input before it can start:

          $(cat .factory/QUESTIONS.md)

          Update the ticket, then move it back to **Agent Ready**."
            linear_set_state "$ISSUE_ID" "Needs Human"
            exit 0
          fi

          body_file="$RUNNER_TEMP/pr_body.md"
          {
            echo "Linear: [$ISSUE_IDENTIFIER]($ISSUE_URL)"
            echo
            if [ -s .factory/PR_BODY.md ]; then cat .factory/PR_BODY.md; else echo "_The agent didn't write a summary._"; fi
          } > "$body_file"
          rm -rf .factory

          git add -A
          if ! git diff --cached --quiet; then
            git -c user.name="factory-bot" -c user.email="factory-bot@users.noreply.github.com" \
              commit -q -m "$ISSUE_IDENTIFIER: $ISSUE_TITLE"
          fi
          if [ "$(git rev-list --count "$BASE_SHA"..HEAD)" = "0" ]; then
            linear_comment "$ISSUE_ID" "🏭 The builder agent finished without changing any code. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            linear_set_state "$ISSUE_ID" "Needs Human"
            exit 0
          fi

          gh auth setup-git
          git push -u origin "$BRANCH"
          gh label create agent-built --color 5319E7 --description "Opened by the factory builder agent" --force >/dev/null
          gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" \
            --title "$ISSUE_IDENTIFIER: $ISSUE_TITLE" --body-file "$body_file" --label agent-built
          pr_number=$(gh pr view "$BRANCH" --json number -q .number)
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          linear_comment "$ISSUE_ID" "🏭 Pull request opened: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pull/$pr_number. The reviewer agent is checking it now."

      - name: Report failure
        if: failure()
        run: |
          [ -f "$RUNNER_TEMP/linear.sh" ] || exit 0
          source "$RUNNER_TEMP/linear.sh"
          linear_comment "$ISSUE_ID" "💥 The factory build failed. Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          linear_set_state "$ISSUE_ID" "Needs Human"
