# Builder agent. Called from each app repo's factory.yml for two events:
#   factory-build: a Linear issue moved to "Agent Ready" (sent by the relay)
#   factory-fix:   the reviewer (or Koen, in a Linear comment) asked for changes on an agent PR,
#                  or the update job found merge conflicts with the base branch (KV-49)
# The logic lives in agents/build/ and agents/lib/ of the factory repo, fetched at run
# time from main, so the factory can change it through normal PRs.
name: Factory build

on:
  workflow_call:
    outputs:
      pr_number:
        description: Pull request that was opened or updated (empty if none)
        value: ${{ jobs.build.outputs.pr_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: true
      FACTORY_APP_ID:
        required: false
      FACTORY_APP_PRIVATE_KEY:
        required: false

jobs:
  build:
    # Pinned so the headless browser's system packages stay supported.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    outputs:
      pr_number: ${{ steps.publish.outputs.pr_number }}
    env:
      FACTORY_REPO: ${{ github.repository_owner }}/factory
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      EVENT_TYPE: ${{ github.event.action }}
      ISSUE_IDENTIFIER: ${{ github.event.client_payload.identifier }}
      ISSUE_TITLE: ${{ github.event.client_payload.title }}
      ISSUE_DESCRIPTION: ${{ github.event.client_payload.description }}
      ISSUE_URL: ${{ github.event.client_payload.url }}
      PR_NUMBER: ${{ github.event.client_payload.pr_number }}
      FIX_ROUND: ${{ github.event.client_payload.round }}
      FIX_FEEDBACK: ${{ github.event.client_payload.feedback }}
      # "true" when Koen asked for the changes in a Linear comment (KV-45)
      FIX_REQUESTED: ${{ github.event.client_payload.requested }}
      # "true" when the update job found merge conflicts with the base branch (KV-49)
      FIX_CONFLICT: ${{ github.event.client_payload.conflict }}
      # The event's payload as sent, so a retry after Claude's usage limit starts the same run (docs/usage-limits.md)
      FACTORY_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
      HAS_APP: ${{ secrets.FACTORY_APP_ID != '' }}

    steps:
      - name: Fetch factory scripts
        run: |
          git clone -q --depth 1 "https://github.com/$FACTORY_REPO.git" "$RUNNER_TEMP/factory"
          echo "FACTORY_DIR=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare workspace
        id: branch
        run: bash "$FACTORY_DIR/agents/build/prepare.sh"

      - name: Set up headless browser
        continue-on-error: true
        run: bash "$FACTORY_DIR/agents/browser-setup.sh"

      # The factory's GitHub App. Its token is only handed to the Publish step, so Claude never sees it.
      - name: Factory app identity
        id: appinfo
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Render prompt
        id: prompt
        run: bash "$FACTORY_DIR/agents/lib/render.sh" "$FACTORY_DIR/agents/build/prompt.md" text

      - name: Build with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fix rounds are started by the factory app (or the workflow bot without it), so allow those.
          allowed_bots: github-actions,${{ steps.appinfo.outputs.app-slug }}
          claude_args: >-
            --max-turns 100
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Bash"
          prompt: ${{ steps.prompt.outputs.text }}

      # A fresh token (they last an hour) so pushes, PRs and merges count as the app's:
      # they start CI and deploy workflows, which the built-in workflow token can't.
      - name: Factory app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE_SHA: ${{ steps.branch.outputs.base_sha }}
          BASE_BRANCH: ${{ steps.branch.outputs.base }}
        run: bash "$FACTORY_DIR/agents/build/publish.sh"

      - name: Report failure
        if: failure()
        run: |
          [ -n "$FACTORY_DIR" ] || exit 0
          bash "$FACTORY_DIR/agents/build/report-failure.sh"
