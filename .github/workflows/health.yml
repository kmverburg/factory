# Daily factory health check (agents/health/, docs/health-check.md): tests the relay, GitHub, Cloudflare, Linear and
# the secrets, and files one Linear ticket per failed check. Can also be started by hand; "dry run" only prints.
name: Factory health check

on:
  schedule:
    # 06:30 UTC, after the log scout (05:00).
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only print the results, don't create or update Linear tickets)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: factory-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # No `repositories` filter: one token for every repo the factory app is installed on. A failure is a result of
      # the check (secret FACTORY_APP_*), not a failed run.
      - name: Factory app token
        id: app
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Secret values only go to the checks as environment variables; the scripts never print them.
      - name: Run the health check
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_TOKEN_OK: ${{ steps.app.outputs.token != '' }}
          FACTORY_REPO: ${{ github.repository }}
          RELAY_URL: ${{ vars.RELAY_URL || secrets.RELAY_URL }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          HEALTH_ORG_TOKEN: ${{ secrets.HEALTH_ORG_TOKEN }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FACTORY_APP_ID: ${{ secrets.FACTORY_APP_ID }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: bash agents/health/health.sh
