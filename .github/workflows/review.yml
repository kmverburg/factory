# Reviewer agent. Called from each app repo's factory.yml after the builder opens or
# updates a PR, and when someone opens a PR by hand. It decides:
#   approve:  nothing to fix
#   fix:      sends concrete changes back to the builder (agent PRs only, max 2 rounds)
#   escalate: a human needs to look
# and files repo-level gaps as follow-up tickets in Linear (Todo).
# The logic lives in agents/review/ and agents/lib/ of the factory repo, fetched at run
# time from main, so the factory can change it through normal PRs.
name: Factory review

on:
  workflow_call:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: string
      fix_round:
        description: How many automatic fix rounds this PR already had
        required: false
        type: string
        default: "0"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      LINEAR_API_KEY:
        required: false
      FACTORY_APP_ID:
        required: false
      FACTORY_APP_PRIVATE_KEY:
        required: false
      CLOUDFLARE_BUILDS_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

jobs:
  review:
    # Pinned so the headless browser's system packages stay supported.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write # needed to send the factory-fix event
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    env:
      FACTORY_REPO: ${{ github.repository_owner }}/factory
      MAX_FIX_ROUNDS: 2
      MAX_FOLLOW_UPS: 3
      PR_NUMBER: ${{ inputs.pr_number }}
      FIX_ROUND: ${{ inputs.fix_round }}
      GH_TOKEN: ${{ github.token }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      HAS_APP: ${{ secrets.FACTORY_APP_ID != '' }}

    steps:
      - name: Fetch factory scripts
        run: |
          git clone -q --depth 1 "https://github.com/$FACTORY_REPO.git" "$RUNNER_TEMP/factory"
          echo "FACTORY_DIR=$RUNNER_TEMP/factory" >> "$GITHUB_ENV"

      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false

      # The factory's GitHub App. Its token is only handed to the Publish step, so Claude never sees it.
      - name: Factory app token
        id: app
        if: env.HAS_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Gather context
        id: context
        env:
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          # Read-only Cloudflare token for fetching Workers Builds logs of failed checks (KOE-15).
          # Only this step gets it, so Claude never sees it.
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash "$FACTORY_DIR/agents/review/gather.sh"

      - name: Set up headless browser
        continue-on-error: true
        run: bash "$FACTORY_DIR/agents/browser-setup.sh"

      - name: Render prompt
        id: prompt
        env:
          BASE_BRANCH: ${{ steps.context.outputs.base }}
        run: bash "$FACTORY_DIR/agents/lib/render.sh" "$FACTORY_DIR/agents/review/prompt.md" text

      - name: Review with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fix rounds are started by the factory app (or the workflow bot without it), so allow those.
          allowed_bots: github-actions,${{ steps.app.outputs.app-slug }}
          # PRs opened by the builder are authored by a bot, which the action treats as untrusted and
          # then blocks all commands. Lift that only for our own agent PRs.
          restrict_untrusted_prs: ${{ steps.context.outputs.agent_pr == 'true' && 'false' || 'true' }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Read,Write,Glob,Grep,Bash"
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Publish verdict
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          # Auto-merge (KOE-14) only runs with the app's token, so the merge starts deploy workflows.
          FACTORY_APP_TOKEN: ${{ steps.app.outputs.token }}
          IDENTIFIER: ${{ steps.context.outputs.identifier }}
          IS_FOLLOW_UP: ${{ steps.context.outputs.is_follow_up }}
          AGENT_PR: ${{ steps.context.outputs.agent_pr }}
        run: bash "$FACTORY_DIR/agents/review/publish.sh"
