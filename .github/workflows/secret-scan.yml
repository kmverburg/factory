# Daily secret scan (agents/secrets/, docs/secret-scan.md): looks for leaked secrets in the last day's GitHub Actions
# logs of every repo, Cloudflare Workers Builds logs and new commits on every branch, and files a high-priority ticket
# per leak in the Factory project. Can also be started by hand; "dry run" only prints what it found.
name: Factory secret scan

on:
  schedule:
    # 04:45 UTC, after the health check (04:30) and before the log scout (05:00).
    - cron: "45 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (only print what was found, don't create tickets or change repo settings)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: factory-secret-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One token for every repo the factory app is installed on (needs Actions: Read, Contents: Read, Metadata: Read;
      # Administration: Read and write lets it turn on GitHub's secret scanning).
      - name: Factory app token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FACTORY_APP_ID }}
          private-key: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # The scan prints places and secret types only, never a secret. The current secrets are only compared as hashes.
      - name: Scan for leaked secrets
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          FACTORY_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BUILDS_TOKEN: ${{ secrets.CLOUDFLARE_BUILDS_TOKEN }}
          CLOUDFLARE_OBSERVABILITY_TOKEN: ${{ secrets.CLOUDFLARE_OBSERVABILITY_TOKEN }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          FACTORY_APP_PRIVATE_KEY: ${{ secrets.FACTORY_APP_PRIVATE_KEY }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: bash agents/secrets/scan.sh
